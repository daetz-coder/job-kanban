name: ✨ 功能建议
description: 提一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提需求！请说明**你想解决什么问题**，而不只是「加个按钮」——场景比方案更重要。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: |
        例如：投递到后期要跟 HR 约时间，现在只能在备注里写，看不到时间线
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么做
      placeholder: |
        例如：希望每条记录能有多个「日程」，并在列表里按时间排序提醒
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      placeholder: 例如：目前用「下一步 / 下一步截止」凑合，但只能记一条
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 这个改动大概涉及
      multiple: true
      options:
        - 前端界面（dashboard.html）
        - 数据格式（ledger.json 字段）
        - 本地服务 / API（server.py）
        - 工具脚本（tools/）
        - 文档

  - type: checkboxes
    id: constraints
    attributes:
      label: 设计约束确认
      description: 本项目有三条底线（见 CONTRIBUTING.md）
      options:
        - label: 该功能不需要引入运行时第三方依赖
          required: true
        - label: 该功能不会自动改动记录数（不静默合并 / 删除数据）
          required: true
