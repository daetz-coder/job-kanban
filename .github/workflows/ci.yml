name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（${{ matrix.os }} / Node ${{ matrix.node }} / Python ${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 覆盖「最新」与「最低支持版本」，外加一个 Windows 交叉验证
        include:
          - { os: ubuntu-latest,  node: '20', python: '3.12' }
          - { os: ubuntu-latest,  node: '18', python: '3.9'  }
          - { os: windows-latest, node: '20', python: '3.12' }

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 前端回归测试
        run: node tests/dashboard.test.js

      - name: Python 语法检查
        run: python -m py_compile server.py tools/build-embed.py tools/check-links.py tools/sync-timeline.py tools/screenshot.py tests/smoke_test.py tests/safety_check.py tests/cjk_check.py

      - name: 服务冒烟测试（跨平台，无需 bash / curl）
        run: python tests/smoke_test.py

      - name: 开源安全与隐私检查
        run: python tests/safety_check.py

      - name: 英文界面不得含中文（渲染后 DOM 守卫）
        run: python tests/cjk_check.py
