name: Release

# 打 tag（v*）时构建三种分发形态并上传到 GitHub Release：
#   1) 免安装可执行文件（Windows / macOS / Linux，PyInstaller）
#   2) Python 包（sdist + wheel，支持 pip / pipx / uvx）
#   3) 单文件 dashboard.html（双击即用，纯前端）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发版前先跑一遍完整检查
  verify:
    name: 发版前检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node tests/dashboard.test.js
      - run: python tests/smoke_test.py
      - run: python tests/safety_check.py
      - run: python tests/cjk_check.py

  # ① 免安装可执行文件
  binary:
    name: 可执行文件（${{ matrix.name }}）
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, asset: job-kanban-windows.exe }
          - { os: macos-latest,   name: macos,   asset: job-kanban-macos }
          - { os: ubuntu-latest,  name: linux,   asset: job-kanban-linux }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 构建
        run: pyinstaller packaging/job-kanban.spec --noconfirm --distpath dist-bin --workpath build-tmp

      - name: 冒烟测试（跑一下构建出来的可执行文件）
        shell: bash
        run: |
          set -e
          BIN="dist-bin/job-kanban"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" --port 8799 --no-browser --data "$RUNNER_TEMP/ci-ledger.json" &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8799/api/state >/dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8799/api/state | head -c 120; echo
          curl -sf -X PUT http://127.0.0.1:8799/api/app/rel-001 \
            -H 'Content-Type: application/json' -d '{"id":"rel-001","企业":"Release Check"}'; echo
          curl -sf http://127.0.0.1:8799/api/state | grep -q 'Release Check' && echo "binary OK"
          kill $PID

      - name: 改名并准备上传
        shell: bash
        run: |
          set -e
          mkdir -p out
          if [ -f dist-bin/job-kanban.exe ]; then cp dist-bin/job-kanban.exe "out/${{ matrix.asset }}";
          else cp dist-bin/job-kanban "out/${{ matrix.asset }}"; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: out/*

  # ② Python 包 + ③ 单文件 HTML
  python-package:
    name: Python 包与单文件
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: 把资源放进包里（仓库只保留根目录一份源）
        run: python packaging/stage_package_data.py

      - name: 构建 sdist 与 wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: 校验安装后的命令可用
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/job-kanban --version
          /tmp/venv/bin/python -c "import job_kanban, os; p=job_kanban._resource('dashboard.html'); print('bundled dashboard:', os.path.exists(p))"

      - name: 清理暂存副本
        run: python packaging/stage_package_data.py --clean

      - name: 准备上传
        run: |
          mkdir -p out
          cp dist/*.whl dist/*.tar.gz out/
          cp dashboard.html out/job-kanban-standalone.html
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: out/*

  # 汇总上传到 Release
  release:
    name: 发布到 GitHub Release
    needs: [binary, python-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "See [CHANGELOG.md](CHANGELOG.md) for details."
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
