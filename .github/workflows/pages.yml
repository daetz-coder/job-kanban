name: Deploy demo to GitHub Pages

# 把 dashboard.html 发布为站点首页，提供「在线试用」（无后端，数据存浏览器本地）
#
# 注意：GitHub Pages 在免费账号下只支持公开仓库。因此这里加了守卫——
# 仓库还是私有的时候自动跳过，转为公开后无需改动即可生效。
on:
  push:
    branches: [main, master]
    paths:
      - 'dashboard.html'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备站点
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp -r docs _site/docs
          cp manifest.webmanifest _site/manifest.webmanifest
          cp sw.js _site/sw.js
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
